---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.0
  name: databases.pgbeam.io
spec:
  group: pgbeam.io
  names:
    categories:
    - crossplane
    - managed
    - pgbeam
    kind: Database
    listKind: DatabaseList
    plural: databases
    singular: database
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .metadata.annotations.crossplane\.io/external-name
      name: EXTERNAL-NAME
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Database is a managed resource that represents a PgBeam Database.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DatabaseSpec defines the desired state of a Database.
            properties:
              deletionPolicy:
                default: Delete
                description: |-
                  DeletionPolicy specifies what will happen to the underlying external
                  when this managed resource is deleted - either "Delete" or "Orphan" the
                  external resource.
                  This field is planned to be deprecated in favor of the ManagementPolicies
                  field in a future release. Currently, both could be set independently and
                  non-default values would be honored if the feature flag is enabled.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                enum:
                - Orphan
                - Delete
                type: string
              forProvider:
                description: DatabaseForProvider defines the desired state of a Database.
                properties:
                  autoReadRouting:
                    default: false
                    description: AutoReadRouting is the when enabled and replicas
                      are configured, select queries automatically route to read replicas
                      without requiring the @pgbeam:replica sql annotation.
                    type: boolean
                  cacheConfig:
                    description: CacheConfig is the query cache configuration.
                    properties:
                      enabled:
                        default: true
                        description: Enabled is the whether query caching is enabled.
                          when false, all queries bypass the cache.
                        type: boolean
                      maxEntries:
                        default: 10000
                        description: MaxEntries is the maximum number of cached query
                          results.
                        maximum: 1000000
                        minimum: 0
                        type: integer
                      swrSeconds:
                        default: 30
                        description: SWRSeconds is the stale-while-revalidate window
                          in seconds.
                        maximum: 86400
                        minimum: 0
                        type: integer
                      ttlSeconds:
                        default: 60
                        description: TTLSeconds is the cache ttl in seconds for query
                          results.
                        maximum: 86400
                        minimum: 0
                        type: integer
                    required:
                    - enabled
                    - maxEntries
                    - swrSeconds
                    - ttlSeconds
                    type: object
                  host:
                    description: Host is the postgresql host.
                    type: string
                  name:
                    description: Name is the postgresql database name.
                    type: string
                  passwordSecretRef:
                    description: PasswordSecretRef is the postgresql password. stored
                      encrypted at rest.
                    properties:
                      key:
                        description: The key to select.
                        type: string
                      name:
                        description: Name of the secret.
                        type: string
                      namespace:
                        description: Namespace of the secret.
                        type: string
                    required:
                    - key
                    - name
                    - namespace
                    type: object
                  poolConfig:
                    description: PoolConfig is the connection pool configuration.
                    properties:
                      maxActive:
                        default: 200
                        description: MaxActive is the maximum concurrent upstream
                          connections per pool.
                        maximum: 10000
                        minimum: 1
                        type: integer
                      minPoolSize:
                        default: 1
                        description: MinPoolSize is the minimum idle connections maintained.
                        maximum: 10000
                        minimum: 1
                        type: integer
                      poolMode:
                        description: PoolMode is the connection pool mode.
                        enum:
                        - session
                        - transaction
                        - statement
                        type: string
                      poolSize:
                        default: 10
                        description: PoolSize is the maximum connections in the pool.
                        maximum: 10000
                        minimum: 1
                        type: integer
                    required:
                    - minPoolSize
                    - poolMode
                    - poolSize
                    type: object
                  poolRegion:
                    description: PoolRegion is the region where the connection pool
                      is maintained (near the database). when set and different from
                      the client's edge region, queries are relayed through the pool
                      region's data plane. empty means direct connection.
                    type: string
                  port:
                    description: Port is the postgresql port.
                    maximum: 65535
                    minimum: 1
                    type: integer
                  projectID:
                    description: ProjectID is the owning project id.
                    type: string
                  queryTimeoutMs:
                    default: 0
                    description: QueryTimeoutMs is the query timeout in milliseconds.
                      when set (> 0), the proxy sends set statement_timeout on upstream
                      connections. 0 means disabled (default).
                    maximum: 300000
                    minimum: 0
                    type: integer
                  role:
                    default: primary
                    description: Role is the database role. primary receives writes,
                      replicas receive reads.
                    enum:
                    - primary
                    - replica
                    type: string
                  sslMode:
                    description: SSLMode is the postgresql ssl connection mode.
                    enum:
                    - disable
                    - allow
                    - prefer
                    - require
                    - verify-ca
                    - verify-full
                    type: string
                  username:
                    description: Username is the postgresql username.
                    type: string
                required:
                - host
                - name
                - passwordSecretRef
                - port
                - projectID
                - username
                type: object
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  This field is planned to replace the DeletionPolicy field in a future
                  release. Currently, both could be set independently and non-default
                  values would be honored if the feature flag is enabled. If both are
                  custom, the DeletionPolicy field will be ignored.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  name:
                    description: Name of the referenced object.
                    type: string
                  policy:
                    description: Policies for referencing.
                    properties:
                      resolution:
                        default: Required
                        description: |-
                          Resolution specifies whether resolution of this reference is required.
                          The default is 'Required', which means the reconcile will fail if the
                          reference cannot be resolved. 'Optional' means this reference will be
                          a no-op if it cannot be resolved.
                        enum:
                        - Required
                        - Optional
                        type: string
                      resolve:
                        description: |-
                          Resolve specifies when this reference should be resolved. The default
                          is 'IfNotPresent', which will attempt to resolve the reference only when
                          the corresponding field is not present. Use 'Always' to resolve the
                          reference on every reconcile.
                        enum:
                        - Always
                        - IfNotPresent
                        type: string
                    type: object
                required:
                - name
                type: object
              publishConnectionDetailsTo:
                description: |-
                  PublishConnectionDetailsTo specifies the connection secret config which
                  contains a name, metadata and a reference to secret store config to
                  which any connection details for this managed resource should be written.
                  Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  configRef:
                    default:
                      name: default
                    description: |-
                      SecretStoreConfigRef specifies which secret store config should be used
                      for this ConnectionSecret.
                    properties:
                      name:
                        description: Name of the referenced object.
                        type: string
                      policy:
                        description: Policies for referencing.
                        properties:
                          resolution:
                            default: Required
                            description: |-
                              Resolution specifies whether resolution of this reference is required.
                              The default is 'Required', which means the reconcile will fail if the
                              reference cannot be resolved. 'Optional' means this reference will be
                              a no-op if it cannot be resolved.
                            enum:
                            - Required
                            - Optional
                            type: string
                          resolve:
                            description: |-
                              Resolve specifies when this reference should be resolved. The default
                              is 'IfNotPresent', which will attempt to resolve the reference only when
                              the corresponding field is not present. Use 'Always' to resolve the
                              reference on every reconcile.
                            enum:
                            - Always
                            - IfNotPresent
                            type: string
                        type: object
                    required:
                    - name
                    type: object
                  metadata:
                    description: Metadata is the metadata for connection secret.
                    properties:
                      annotations:
                        additionalProperties:
                          type: string
                        description: |-
                          Annotations are the annotations to be added to connection secret.
                          - For Kubernetes secrets, this will be used as "metadata.annotations".
                          - It is up to Secret Store implementation for others store types.
                        type: object
                      labels:
                        additionalProperties:
                          type: string
                        description: |-
                          Labels are the labels/tags to be added to connection secret.
                          - For Kubernetes secrets, this will be used as "metadata.labels".
                          - It is up to Secret Store implementation for others store types.
                        type: object
                      type:
                        description: |-
                          Type is the SecretType for the connection secret.
                          - Only valid for Kubernetes Secret Stores.
                        type: string
                    type: object
                  name:
                    description: Name is the name of the connection secret.
                    type: string
                required:
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                  This field is planned to be replaced in a future release in favor of
                  PublishConnectionDetailsTo. Currently, both could be set independently
                  and connection details would be published to both without affecting
                  each other.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                  namespace:
                    description: Namespace of the secret.
                    type: string
                required:
                - name
                - namespace
                type: object
            required:
            - forProvider
            type: object
          status:
            description: DatabaseStatus defines the observed state of a Database.
            properties:
              atProvider:
                description: DatabaseAtProvider defines the observed state of a Database.
                properties:
                  connectionString:
                    description: ConnectionString is the connection string for connecting
                      through pgbeam proxy. password is replaced with a placeholder.
                    type: string
                  createdAt:
                    description: CreatedAt is the when the database registration was
                      created.
                    type: string
                  id:
                    description: ID is the PgBeam database ID.
                    type: string
                  updatedAt:
                    description: UpdatedAt is the when the database registration was
                      last updated.
                    type: string
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
